name: WoningScan
options:
  bundleIdPrefix: com.woningscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WoningScan:
    type: application
    platform: iOS
    sources:
      - path: Sources/WoningScan
        excludes:
          - "Resources/Info.plist"
    info:
      path: Sources/WoningScan/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woningscan.app
        GENERATE_INFOPLIST_FILE: NO
