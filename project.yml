name: WoningScan
options:
  bundleIdPrefix: com.woningscan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  WoningScan:
    type: application
    platform: iOS
    sources:
      - path: Sources/WoningScan
        excludes:
          - "Resources/Info.plist"
    info:
      path: Sources/WoningScan/Resources/Info.plist
      properties:
        CFBundleDisplayName: WoningScan
        CFBundleDevelopmentRegion: nl
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "WoningScan gebruikt de camera om foto's te maken van gevels, ramen en deuren tijdens de opname, en om met AR afstanden in te meten."
        NSLocationWhenInUseUsageDescription: "WoningScan gebruikt het kompas van je toestel om automatisch de oriëntatie (windrichting) van een gevel te bepalen."
        NSPhotoLibraryAddUsageDescription: "WoningScan kan gemaakte foto's opslaan in je fotobibliotheek."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woningscan.app
