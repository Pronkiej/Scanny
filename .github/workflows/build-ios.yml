name: Build iOS app (ongesigneerd, voor Sideloadly)

# Draait volledig op GitHub's gratis macOS-cloud-runners - je hebt hier zelf geen Mac
# of Apple Developer account voor nodig. Het resultaat (WoningScan.ipa) verschijnt als
# "artifact" onderaan de workflow-run in de "Actions"-tab van deze repository; download
# 'm van daar en installeer 'm met Sideloadly + je gratis Apple ID op je iPhone.
#
# Let op: dit .ipa-bestand is NIET gesigneerd. Dat is bewust - Sideloadly doet het signeren
# zelf met jouw Apple ID op het moment van installeren, dus hoeft dit hele traject geen
# Apple Developer Program account (het betaalde account) te gebruiken.

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecteer nieuwste beschikbare Xcode op deze runner
        run: |
          echo "Beschikbare Xcode-versies op deze runner:"
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecteer: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"

      - name: Toon Xcode-versie
        run: xcodebuild -version

      - name: Installeer XcodeGen
        run: brew install xcodegen

      - name: Genereer Xcode-project uit project.yml
        run: xcodegen generate

      - name: Build (ongesigneerd)
        run: |
          xcodebuild build \
            -project WoningScan.xcodeproj \
            -scheme WoningScan \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verpak .app als .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/WoningScan.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Kon $APP_PATH niet vinden - build is waarschijnlijk mislukt, zie de stap hierboven."
            find build/Build/Products -maxdepth 2 || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WoningScan.ipa Payload

      - name: Upload .ipa als artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoningScan-ipa
          path: WoningScan.ipa
          retention-days: 30
